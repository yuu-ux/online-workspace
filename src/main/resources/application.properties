spring.application.name=online-workspace
spring.config.import=classpath:swagger-ui.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

mybatis.configuration.map-underscore-to-camel-case=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.data-retention.chat-history-months=${DATA_RETENTION_CHAT_HISTORY_MONTHS:3}
app.data-retention.withdrawn-work-history-days=${DATA_RETENTION_WITHDRAWN_WORK_HISTORY_DAYS:30}
app.data-retention.cleanup-cron=${DATA_RETENTION_CLEANUP_CRON:0 0 3 * * *}
app.data-retention.zone=${DATA_RETENTION_ZONE:UTC}
app.data-retention.scheduling-enabled=${DATA_RETENTION_SCHEDULING_ENABLED:true}
app.data-retention.run-once=${DATA_RETENTION_RUN_ONCE:false}
