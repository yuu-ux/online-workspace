spring.application.name=online-workspace
spring.config.import=classpath:swagger-ui.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

server.forward-headers-strategy=framework
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

app.security.api-key.value=${APP_API_KEY:}
app.security.api-key.principal=${APP_API_KEY_PRINCIPAL:}
app.security.rate-limit.requests-per-minute=${API_RATE_LIMIT_REQUESTS_PER_MINUTE:60}

app.management.api-key=${MANAGEMENT_API_KEY:}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.tomcat.mbeanregistry.enabled=true

mybatis.configuration.map-underscore-to-camel-case=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
