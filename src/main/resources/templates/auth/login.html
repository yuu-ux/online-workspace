<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | Online Workspace</title>
    <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>ログイン</h1>
            <p><a th:href="@{/users/sign_up}">ユーザー登録はこちら</a></p>
            <div th:if="${param.error}" class="toast toast-error">ログインに失敗しました。</div>
            <div th:if="${param.logout}" class="toast toast-success">ログアウトしました。</div>
            <div th:if="${param.registered}" class="toast toast-success">ユーザー登録が完了しました。ログインしてください。</div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="email">メールアドレス</label>
                <input id="email" name="email" type="email" autocomplete="email" required>

                <label for="password">パスワード</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">ログイン</button>
            </form>
            <p>
                <a th:href="@{/privacy}">プライバシーポリシー</a>
                /
                <a th:href="@{/terms}">利用規約</a>
            </p>
        </section>
    </main>
</body>
</html>
