<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録 | Online Workspace</title>
    <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>ユーザー登録</h1>
            <p><a th:href="@{/login}">ログイン画面へ</a></p>
            <div th:if="${errorMessage}" class="toast toast-error" th:text="${errorMessage}"></div>

            <form th:action="@{/users/sign_up}" method="post" th:object="${signUpForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="name">ユーザー名</label>
                <input id="name" th:field="*{name}" type="text" autocomplete="name">
                <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

                <label for="email">メールアドレス</label>
                <input id="email" th:field="*{email}" type="email" autocomplete="email">
                <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

                <label for="password">パスワード</label>
                <input id="password" th:field="*{password}" type="password" autocomplete="new-password">
                <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

                <label for="passwordConfirmation">確認用パスワード</label>
                <input id="passwordConfirmation" th:field="*{passwordConfirmation}" type="password" autocomplete="new-password">
                <p class="error" th:if="${#fields.hasErrors('passwordConfirmation')}" th:errors="*{passwordConfirmation}"></p>

                <button type="submit">登録</button>
            </form>
        </section>
    </main>
</body>
</html>
