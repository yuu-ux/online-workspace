<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム | Online Workspace</title>
    <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>Online Workspace</h1>
            <p>オンラインで作業ルームを作成し、チャットしながら共同作業できます。</p>
            <p class="muted" th:text="'ログイン中: ' + ${displayName}"></p>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">ログアウト</button>
            </form>
            <p>
                <a th:href="@{/privacy}">プライバシーポリシー</a>
                /
                <a th:href="@{/terms}">利用規約</a>
            </p>
        </header>

        <div th:if="${successMessage}" class="toast toast-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="toast toast-error" th:text="${errorMessage}"></div>

        <section class="card">
            <h2>公開ルーム一覧</h2>
            <p><a th:href="@{/rooms/new}">ルームを作成する</a></p>
            <table class="room-table">
                <thead>
                    <tr>
                        <th>ルーム名</th>
                        <th>参加人数</th>
                        <th>作成日時</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(rooms)}">
                        <td colspan="4">まだルームがありません。</td>
                    </tr>
                    <tr th:each="room : ${rooms}" th:attr="data-room-id=${room.id}">
                        <td th:text="${room.name}"></td>
                        <td><span class="participant-count" th:text="${room.participantCount}"></span>人</td>
                        <td th:text="${#temporals.format(room.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <form th:action="@{'/rooms/' + ${room.id} + '/join'}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit">参加</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script th:src="@{/webjars/sockjs-client/1.5.1/sockjs.min.js}"></script>
    <script th:src="@{/webjars/stomp-websocket/2.3.4/stomp.min.js}"></script>
    <script th:inline="javascript">
      const socket = new SockJS(/*[[@{/ws}]]*/ '/ws');
      const stompClient = Stomp.over(socket);
      stompClient.connect({}, function () {
        stompClient.subscribe('/topic/rooms', function (frame) {
          const payload = JSON.parse(frame.body);
          if (payload.type !== 'room:updated') return;
          const row = document.querySelector('[data-room-id="' + payload.roomId + '"]');
          if (!row) return;
          const participantCount = row.querySelector('.participant-count');
          if (participantCount) participantCount.textContent = payload.participantCount;
        });
      });
    </script>
</body>
</html>
