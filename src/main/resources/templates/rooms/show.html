<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${room.name} + ' | Online Workspace'"></title>
    <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1 th:text="${room.name}"></h1>
            <p class="muted" th:text="'参加中: ' + ${displayName}"></p>
            <a th:href="@{/}">ホームへ戻る</a>
        </header>

        <div th:if="${successMessage}" class="toast toast-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="toast toast-error" th:text="${errorMessage}"></div>

        <section class="card">
            <h2>参加者一覧</h2>
            <ul id="member-list">
                <li th:each="member : ${members}" th:text="${member.userName}"></li>
            </ul>
            <form th:action="@{'/rooms/' + ${room.id} + '/leave'}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">退出</button>
            </form>
        </section>

        <section class="card">
            <h2>チャット</h2>
            <div id="chat-messages" class="chat-messages">
                <article class="chat-message" th:each="message : ${messages}">
                    <header>
                        <strong th:text="${message.userName}"></strong>
                        <time th:text="${#temporals.format(message.sentAt, 'yyyy-MM-dd HH:mm:ss')}"></time>
                    </header>
                    <p th:text="${message.content}"></p>
                </article>
            </div>
            <form th:action="@{'/rooms/' + ${room.id} + '/messages'}" method="post" th:object="${messageForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="content">メッセージ</label>
                <input id="content" th:field="*{content}" type="text" maxlength="500" required>
                <button type="submit">送信</button>
            </form>
        </section>
    </main>

    <script th:src="@{/webjars/sockjs-client/1.5.1/sockjs.min.js}"></script>
    <script th:src="@{/webjars/stomp-websocket/2.3.4/stomp.min.js}"></script>
    <script th:inline="javascript">
      const roomId = /*[[${room.id}]]*/ 0;
      const currentUser = /*[[${displayName}]]*/ '';
      const socket = new SockJS(/*[[@{/ws}]]*/ '/ws');
      const stompClient = Stomp.over(socket);
      stompClient.connect({}, function () {
        stompClient.subscribe('/topic/rooms/' + roomId, function (frame) {
          const payload = JSON.parse(frame.body);
          if (payload.type === 'chat:message') {
            const chat = document.getElementById('chat-messages');
            const article = document.createElement('article');
            article.className = 'chat-message';
            const date = new Date(payload.sentAt);
            article.innerHTML = '<header><strong></strong><time></time></header><p></p>';
            article.querySelector('strong').textContent = payload.senderName;
            article.querySelector('time').textContent = date.toLocaleString();
            article.querySelector('p').textContent = payload.content;
            chat.appendChild(article);
            chat.scrollTop = chat.scrollHeight;
          }
          if (payload.type === 'room:user_joined' || payload.type === 'room:user_left') {
            const memberList = document.getElementById('member-list');
            if (payload.type === 'room:user_joined' && payload.actorName) {
              const exists = Array.from(memberList.children).some((li) => li.textContent === payload.actorName);
              if (!exists) {
                const li = document.createElement('li');
                li.textContent = payload.actorName;
                memberList.appendChild(li);
              }
            }
            if (payload.type === 'room:user_left' && payload.actorName) {
              Array.from(memberList.children).forEach((li) => {
                if (li.textContent === payload.actorName) {
                  li.remove();
                }
              });
            }
          }
        });
      });
    </script>
</body>
</html>
