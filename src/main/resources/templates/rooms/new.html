<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルーム作成 | Online Workspace</title>
    <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>ルーム作成</h1>
            <p><a th:href="@{/}">ホームへ戻る</a></p>
            <div th:if="${errorMessage}" class="toast toast-error" th:text="${errorMessage}"></div>

            <form th:action="@{/rooms}" method="post" th:object="${roomCreateForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="name">ルーム名</label>
                <input id="name" th:field="*{name}" type="text" maxlength="100" required>
                <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                <button type="submit">作成</button>
            </form>
        </section>
    </main>
</body>
</html>
