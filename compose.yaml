services:
  proxy:
    image: nginx:1.27-alpine
    container_name: online-workspace-proxy
    restart: unless-stopped
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/config:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/tls:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: online-workspace-frontend
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    image: eclipse-temurin:25-jdk
    container_name: online-workspace-backend
    working_dir: /app
    command: ./gradlew bootRun --no-daemon
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: password
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:-}
      LOGGING_FILE_NAME: /var/log/app/application.log
    volumes:
      - ./build.gradle:/app/build.gradle:ro
      - ./settings.gradle:/app/settings.gradle:ro
      - ./gradle:/app/gradle:ro
      - ./gradlew:/app/gradlew:ro
      - ./docs/openapi.yaml:/app/docs/openapi.yaml:ro
      - ./src:/app/src
      - gradle_cache:/root/.gradle
      - app_logs:/var/log/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: online-workspace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules:
  gradle_cache:
  app_logs:
