services:
  proxy:
    build:
      context: ./docker/nginx
    container_name: online-workspace-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-8088}:80"
      - "${PROXY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/config:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/tls
      - ./frontend/priv/static:/var/www/static:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    container_name: online-workspace-frontend
    working_dir: /app
    user: "0:0"
    command:
      - sh
      - -c
      - |
        npm run build:css || exit 1
        npm run watch:css &
        exec gleam run -m lustre/dev start --host=0.0.0.0 --port=5173
    volumes:
      - ./frontend:/app
      - frontend_build:/app/build
      - frontend_node_modules:/app/node_modules
      - frontend_lustre:/app/.lustre
    depends_on:
      - backend

  # チャット機能テスト用
  ws-mock:
    image: denoland/deno:alpine
    container_name: online-workspace-ws-mock
    working_dir: /app
    ports:
      - "${WS_MOCK_PORT:-8081}:8081"
    volumes:
      - ./mock-server:/app
    command: run --allow-net server.ts

  backend:
    image: eclipse-temurin:25-jdk
    container_name: online-workspace-backend
    working_dir: /app
    command: ./gradlew bootRun --no-daemon
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-postgres}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SESSION_COOKIE_HTTP_ONLY: ${SESSION_COOKIE_HTTP_ONLY:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      APP_API_KEY: ${APP_API_KEY:-}
      APP_API_KEY_PRINCIPAL: ${APP_API_KEY_PRINCIPAL:-}
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:?MANAGEMENT_API_KEY is required}
      LOGGING_FILE_NAME: /var/log/app/application.log
    volumes:
      - ./build.gradle:/app/build.gradle:ro
      - ./settings.gradle:/app/settings.gradle:ro
      - ./gradle:/app/gradle:ro
      - ./gradlew:/app/gradlew:ro
      - ./docs/openapi.yaml:/app/docs/openapi.yaml:ro
      - ./src:/app/src
      - gradle_cache:/root/.gradle
      - app_logs:/var/log/app
      - avatar_data:/app/data/avatars
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: online-workspace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend_build:
  frontend_node_modules:
  frontend_lustre:
  gradle_cache:
  app_logs:
  avatar_data:
