services:
  proxy:
    image: nginx:1.27-alpine
    container_name: online-workspace-proxy
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    image: node:22-alpine
    container_name: online-workspace-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8088
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    image: eclipse-temurin:25-jdk
    container_name: online-workspace-backend
    working_dir: /app
    command: ./gradlew bootRun --no-daemon
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: password
      MAIL_HOST: maildev
      MAIL_PORT: 1025
    volumes:
      - .:/app
      - gradle_cache:/root/.gradle
    depends_on:
      db:
        condition: service_healthy
      maildev:
        condition: service_started

  db:
    image: postgres:16
    container_name: online-workspace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev:2.1.0
    container_name: online-workspace-maildev
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1080 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules:
  gradle_cache:
