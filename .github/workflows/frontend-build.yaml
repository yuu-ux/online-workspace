name: Frontend build

on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/frontend-build.yaml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file frontend/Dockerfile.dev --tag online-workspace-frontend frontend
      - run: docker run --rm online-workspace-frontend npm test

# 変更点: npm run build ではなく、Lustre のビルドコマンドを実行
      - run: >-
          docker run --rm online-workspace-frontend sh -c
          'gleam run -m lustre/dev build app >/tmp/build.log 2>&1 || { tail -n 250 /tmp/build.log; exit 1; }'
