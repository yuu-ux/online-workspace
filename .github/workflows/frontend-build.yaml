name: Frontend build

on:
  pull_request:
    paths:
      - frontend/**
      - docker/nginx/**
      - .dockerignore
      - .github/workflows/frontend-build.yaml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file docker/nginx/Dockerfile --target frontend-build --tag online-workspace-frontend .
      - run: docker run --rm online-workspace-frontend npm test

      - run: >-
          docker run --rm online-workspace-frontend sh -c
          'test -s dist/index.html && test -s dist/frontend.js && test -s dist/tailwind.css'
      - run: docker build --file docker/nginx/Dockerfile --tag online-workspace-proxy .
      - run: >-
          docker run --rm online-workspace-proxy sh -c
          'test -s /var/www/static/index.html && test -s /var/www/static/frontend.js && test -s /var/www/static/tailwind.css'
