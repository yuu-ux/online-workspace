openapi: 3.0.3
info:
  title: Online Workspace API
  version: 0.1.0
  description: |
    Online Workspace のフロントエンドと Spring Boot サーバー間の REST API 契約。
    日時は RFC 3339、ID は 64 bit integer、JSON の property 名は lowerCamelCase とする。

    ブラウザ向け API は `SESSION` cookie を使用する。クライアントは最初に `GET /auth/csrf` で
    `XSRF-TOKEN` cookieを発行し、その値を状態変更リクエストの `X-CSRF-TOKEN` header に設定する。

    API key 認証と rate limit の採点対象は、ルーム一覧、作成、詳細、更新、削除の5 operation とする。
    API key は発行先のユーザーまたはservice principalへ紐付き、各operationの認可判定にもその主体を使用する。
    監視用 health check も API key で保護する。
servers:
  - url: /api/v1
    description: 同一 origin の API

tags:
  - name: Authentication
    description: 登録、ログイン、ログアウト、認証状態
  - name: Users
    description: ユーザー検索とプロフィール
  - name: Room categories
    description: ルームカテゴリ
  - name: Rooms
    description: ルームと参加者
  - name: Messages
    description: ルーム内チャット履歴と送信
  - name: Friends
    description: フレンド
  - name: Operations
    description: システム監視

security:
  - sessionAuth: []

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: ユーザーを登録する
      operationId: registerUser
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          description: ユーザー登録完了。ログインセッションは作成しない
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: ログインする
      operationId: login
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: ログインしたユーザー。`SESSION` cookie を設定する
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly、Secure、SameSite 属性を持つ session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: ログアウトする
      operationId: logout
      security:
        - sessionAuth: []
          csrfToken: []
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '204':
          description: ログアウト完了。サーバー側の認証セッションを無効化する。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/session:
    get:
      tags: [Authentication]
      summary: 認証状態を取得する
      description: 未ログイン時も 200 を返し、`authenticated` で状態を表す。
      operationId: getSession
      security: []
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: 現在の認証状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/csrf:
    get:
      tags: [Authentication]
      summary: CSRF token用Cookieを初期化する
      description: |
        セッションの有無にかかわらず呼び出せる。CSRF tokenを遅延生成して `XSRF-TOKEN` cookieを発行する。
        レスポンス本文は返さず、クライアントはcookieの値を以降の状態変更リクエストの
        `X-CSRF-TOKEN` headerへ設定する。
      operationId: getCsrfToken
      security: []
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '204':
          description: XSRF-TOKEN cookieを発行した。レスポンス本文は空。
          headers:
            Set-Cookie:
              description: "XSRF-TOKEN cookie。ブラウザクライアントから読み取れるようHttpOnlyは付与しない"
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users:
    get:
      tags: [Users]
      summary: ユーザーを検索する
      description: 名前の部分一致で検索する。
      operationId: searchUsers
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: ユーザー検索結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}:
    get:
      tags: [Users]
      summary: ユーザープロフィールを取得する
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: 公開範囲を反映したプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/profile:
    get:
      tags: [Users]
      summary: 自分のプロフィールを取得する
      operationId: getMyProfile
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: 自分のプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      summary: 自分のプロフィールを更新する
      operationId: updateMyProfile
      security:
        - sessionAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: 更新後のプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/me:
    delete:
      tags: [Users]
      summary: 退会する
      operationId: withdrawCurrentUser
      security:
        - sessionAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '204':
          description: 退会完了。現在の session も無効化する
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /room-categories:
    get:
      tags: [Room categories]
      summary: 利用可能なルームカテゴリを取得する
      operationId: listRoomCategories
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: 表示順に並んだカテゴリ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms:
    get:
      tags: [Rooms]
      summary: 参加可能なルームを取得する
      operationId: listRooms
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - name: categoryId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: workStyle
          in: query
          schema:
            $ref: '#/components/schemas/WorkStyle'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: 参加可能なルーム一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Rooms]
      summary: ルームを作成する
      operationId: createRoom
      security:
        - sessionAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          description: 作成したルーム。作成者は参加済みになる
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      summary: ルーム詳細を取得する
      operationId: getRoom
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: ルーム詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Rooms]
      summary: ルーム設定を更新する
      description: ルーム作成者だけが実行できる。
      operationId: updateRoom
      security:
        - sessionAuth: []
          csrfToken: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: 更新後のルーム
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Rooms]
      summary: ルームを閉じる
      description: ルーム作成者だけが実行できる。
      operationId: closeRoom
      security:
        - sessionAuth: []
          csrfToken: []
        - apiKeyAuth: []
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '204':
          description: ルームを閉じた
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /rooms/{roomId}/members:
    get:
      tags: [Rooms]
      summary: 参加中のメンバーを取得する
      operationId: listRoomMembers
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: 参加中のメンバー
          content:
            application/json:
              schema:
                type: array
                maxItems: 12
                items:
                  $ref: '#/components/schemas/RoomMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{roomId}/members/me:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Rooms]
      summary: ルームへ参加する
      operationId: joinRoom
      security:
        - sessionAuth: []
          csrfToken: []
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          description: 参加情報。作業 session も開始する
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Rooms]
      summary: ルームから退出する
      operationId: leaveRoom
      security:
        - sessionAuth: []
          csrfToken: []
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '204':
          description: 退出完了。作業 session も終了する
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /rooms/{roomId}/messages:
    get:
      tags: [Messages]
      summary: ルームのチャット履歴を取得する
      description: ルーム参加者だけが実行できる。
      operationId: listRoomMessages
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: 新しい順のメッセージ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Messages]
      summary: チャットメッセージを送信する
      description: ルーム参加者だけが実行できる。作成後、WebSocket でも配信する。
      operationId: createRoomMessage
      security:
        - sessionAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          description: 送信したメッセージ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /friends:
    get:
      tags: [Friends]
      summary: フレンド一覧を取得する
      operationId: listFriends
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: フレンド一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Friends]
      summary: フレンドを追加する
      operationId: createFriend
      security:
        - sessionAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFriendRequest'
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '201':
          description: 追加したフレンド
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friend'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /friends/{friendUserId}:
    parameters:
      - $ref: '#/components/parameters/FriendUserId'
    delete:
      tags: [Friends]
      summary: フレンドを解除する
      operationId: deleteFriend
      security:
        - sessionAuth: []
          csrfToken: []
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '204':
          description: フレンド解除完了
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /actuator/health:
    get:
      tags: [Operations]
      summary: システムの稼働状態を取得する
      operationId: getHealth
      servers:
        - url: /
          description: API prefix 外の監視 endpoint
      security:
        - apiKeyAuth: []
      responses:
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: 正常稼働中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 依存サービスを含めて正常に稼働していない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /actuator/prometheus:
    get:
      tags: [Operations]
      summary: Prometheus向けメトリクスを取得する
      operationId: getMetrics
      servers:
        - url: /
          description: API prefix 外の監視 endpoint
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Prometheus text exposition format のメトリクス
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Security の server-side session cookie
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: |
        `GET /auth/csrf` で発行された `XSRF-TOKEN` cookieの値。session認証で状態を変更するoperationでは必須。
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        ユーザーまたはservice principalに紐付くAPI key。ルームAPIの採点対象5 operationと
        監視用health checkで使用する。key単位でrate limitを適用する。

  parameters:
    Page:
      name: page
      in: query
      description: 0 始まりのページ番号
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: 1ページの件数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    FriendUserId:
      name: friendUserId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'

  responses:
    BadRequest:
      description: リクエストの形式または parameter が不正
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 認証情報がない、または無効
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 対象操作を行う権限がない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 対象 resource が存在しない、または参照できない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 現在の resource 状態または業務ルールと競合する
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: 予期しないサーバーエラー
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 500
            code: INTERNAL_SERVER_ERROR
            message: 予期しないエラーが発生しました。
            path: /api/v1/rooms/42
            timestamp: '2026-08-04T12:34:56Z'
            traceId: 2f1c16cb-9c67-44a8-9e85-81efba46b85a
    ValidationError:
      description: 入力 validation に失敗した
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationApiError'
    TooManyRequests:
      description: rate limit を超過した
      headers:
        Retry-After:
          description: 再試行までの秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
      example: 42

    AccountStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, BANNED]

    WorkStyle:
      type: string
      enum: [FOCUS, CHAT_OK]

    RoomStatus:
      type: string
      enum: [OPEN, CLOSED]

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages, first, last]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          pattern: '^[\x21-\x7E]+$'
          description: 半角の英字・数字・記号（空白を除く）で8〜72文字。UTF-8エンコード時も72バイト以内
          writeOnly: true

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: 前後の空白を除去し、小文字化して照合する
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          pattern: '^[\x21-\x7E]+$'
          description: 半角の英字・数字・記号（空白を除く）。UTF-8エンコード時に72バイト以内
          writeOnly: true

    AuthenticatedUser:
      type: object
      required: [id, name, email, accountStatus]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
          format: email
        accountStatus:
          $ref: '#/components/schemas/AccountStatus'
        suspendedUntil:
          type: string
          format: date-time
          nullable: true

    SessionStatus:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
        user:
          type: object
          allOf:
            - $ref: '#/components/schemas/AuthenticatedUser'
          nullable: true

    UserSummary:
      type: object
      required: [id, name, iconUrl]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 100
        iconUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true

    UserProfile:
      description: 公開設定に応じたプロフィール。非公開時は名前とアイコン以外のプロフィール情報を返さない。
      oneOf:
        - $ref: '#/components/schemas/PublicUserProfile'
        - $ref: '#/components/schemas/HiddenUserProfile'

    PublicUserProfile:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [isPublic, bio, workCategory, friendship]
          properties:
            isPublic:
              type: boolean
              enum: [true]
            bio:
              type: string
              maxLength: 500
            workCategory:
              type: object
              allOf:
                - $ref: '#/components/schemas/RoomCategory'
              nullable: true
            friendship:
              type: string
              enum: [NONE, FRIEND]

    HiddenUserProfile:
      type: object
      additionalProperties: false
      required: [name, iconUrl, isPublic]
      properties:
        name:
          type: string
          maxLength: 100
        iconUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        isPublic:
          type: boolean
          enum: [false]

    MyProfile:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required:
            - isPublic
            - bio
            - workCategory
            - friendship
            - email
            - accountStatus
            - createdAt
          properties:
            isPublic:
              type: boolean
            bio:
              type: string
              maxLength: 500
            workCategory:
              type: object
              allOf:
                - $ref: '#/components/schemas/RoomCategory'
              nullable: true
            friendship:
              type: string
              enum: [NONE, FRIEND]
            email:
              type: string
              format: email
            accountStatus:
              $ref: '#/components/schemas/AccountStatus'
            createdAt:
              type: string
              format: date-time

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [name, iconUrl, bio, workCategoryId, isPublic]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        iconUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true
          description: http/httpsの画像URL。nullを指定すると設定済みのアイコンを削除する。
        bio:
          type: string
          maxLength: 500
        workCategoryId:
          type: integer
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        isPublic:
          type: boolean

    WithdrawRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: UTF-8 エンコード時に72バイト以内
          minLength: 1
          maxLength: 72
          writeOnly: true

    UserPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        page:
          $ref: '#/components/schemas/PageMeta'

    RoomCategory:
      type: object
      required: [id, name, description, sortOrder]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        sortOrder:
          type: integer

    RoomSummary:
      type: object
      required:
        - id
        - name
        - category
        - workStyle
        - maxMembers
        - currentMembers
        - status
        - createdBy
        - joinable
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 100
        category:
          $ref: '#/components/schemas/RoomCategory'
        workStyle:
          $ref: '#/components/schemas/WorkStyle'
        maxMembers:
          type: integer
          minimum: 2
          maximum: 12
        currentMembers:
          type: integer
          minimum: 0
          maximum: 12
        status:
          $ref: '#/components/schemas/RoomStatus'
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        joinable:
          type: boolean
        joinRestriction:
          type: string
          enum: [FULL, CLOSED]
          nullable: true
        createdAt:
          type: string
          format: date-time

    RoomDetail:
      allOf:
        - $ref: '#/components/schemas/RoomSummary'
        - type: object
          required: [description, member, updatedAt]
          properties:
            description:
              type: string
              maxLength: 500
            member:
              type: boolean
            updatedAt:
              type: string
              format: date-time

    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name, description, categoryId, workStyle, maxMembers]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        categoryId:
          $ref: '#/components/schemas/Id'
        workStyle:
          $ref: '#/components/schemas/WorkStyle'
        maxMembers:
          type: integer
          minimum: 2
          maximum: 12

    UpdateRoomRequest:
      type: object
      additionalProperties: false
      required: [name, description, categoryId, workStyle, maxMembers]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        categoryId:
          $ref: '#/components/schemas/Id'
        workStyle:
          $ref: '#/components/schemas/WorkStyle'
        maxMembers:
          type: integer
          minimum: 2
          maximum: 12

    RoomPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomSummary'
        page:
          $ref: '#/components/schemas/PageMeta'

    RoomMember:
      type: object
      required: [membershipId, user, online, joinedAt]
      properties:
        membershipId:
          $ref: '#/components/schemas/Id'
        user:
          $ref: '#/components/schemas/UserSummary'
        online:
          type: boolean
          description: 認証済みWebSocket接続が1つ以上ある場合はtrue
        joinedAt:
          type: string
          format: date-time

    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500

    ChatMessage:
      type: object
      required: [id, roomId, sender, content, sentAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        roomId:
          $ref: '#/components/schemas/Id'
        sender:
          $ref: '#/components/schemas/UserSummary'
        content:
          type: string
          minLength: 1
          maxLength: 500
        sentAt:
          type: string
          format: date-time

    MessagePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        page:
          $ref: '#/components/schemas/PageMeta'

    CreateFriendRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          $ref: '#/components/schemas/Id'

    Friend:
      type: object
      required: [user, online, createdAt]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        online:
          type: boolean
          description: 認証済みWebSocket接続が1つ以上ある場合はtrue
        createdAt:
          type: string
          format: date-time

    FriendPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Friend'
        page:
          $ref: '#/components/schemas/PageMeta'

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
        components:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
          example:
            db:
              status: UP

    ApiError:
      type: object
      required: [status, code, message, path, timestamp, traceId]
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: ROOM_NOT_JOINABLE
        message:
          type: string
          example: このルームには参加できません。
        path:
          type: string
          example: /api/v1/rooms/42/members/me
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
          description: サーバーログと照合するための識別子

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: maxMembers
        code:
          type: string
          example: RANGE
        message:
          type: string
          example: 2以上12以下で入力してください。

    ValidationApiError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          required: [fieldErrors]
          properties:
            fieldErrors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
