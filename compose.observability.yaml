services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_certs:/usr/share/elasticsearch/config/certs
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --cacert /usr/share/elasticsearch/config/certs/http_ca.crt -u elastic:$${ELASTIC_PASSWORD} https://localhost:9200/_cluster/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.1
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
    volumes:
      - ./docker/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - app_logs:/var/log/app:ro
      - logstash_data:/usr/share/logstash/data
      - elasticsearch_certs:/usr/share/logstash/config/certs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  elk-policy:
    image: curlimages/curl:8.16.0
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
    volumes:
      - ./docker/elk/elasticsearch:/config:ro
      - elasticsearch_certs:/certs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl --fail --silent --show-error \
          --cacert /certs/http_ca.crt \
          -u "elastic:$${ELASTIC_PASSWORD}" \
          -X PUT https://elasticsearch:9200/_ilm/policy/online-workspace-logs \
          -H 'Content-Type: application/json' \
          --data-binary @/config/ilm-policy.json
        curl --fail --silent --show-error \
          --cacert /certs/http_ca.crt \
          -u "elastic:$${ELASTIC_PASSWORD}" \
          -X PUT https://elasticsearch:9200/_index_template/online-workspace-logs \
          -H 'Content-Type: application/json' \
          --data-binary @/config/index-template.json

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.1
    environment:
      ELASTICSEARCH_HOSTS: https://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/certs/http_ca.crt
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - elasticsearch_certs:/usr/share/kibana/config/certs:ro

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    secrets:
      - management_api_key
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus

secrets:
  management_api_key:
    environment: MANAGEMENT_API_KEY
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

volumes:
  elasticsearch_data:
  elasticsearch_certs:
  logstash_data:
  prometheus_data:
  grafana_data:
